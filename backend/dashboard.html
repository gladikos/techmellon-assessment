<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aegis Airlines — Refinement Loop Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .turn-agent { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .turn-user { background: #f9fafb; border-left: 3px solid #6b7280; }
  .turn-tool-call { background: #fefce8; border-left: 3px solid #eab308; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .turn-tool-result { background: #f0fdf4; border-left: 3px solid #22c55e; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .turn-tool-error { background: #fef2f2; border-left: 3px solid #ef4444; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .scenario-divider { background: #1f2937; color: white; padding: 8px 12px; margin: 16px -12px 8px -12px; font-weight: 600; border-radius: 4px; }
  .diff-add { background: #dcfce7; color: #14532d; }
  .diff-remove { background: #fee2e2; color: #7f1d1d; text-decoration: line-through; opacity: 0.7; }
  #conversation::-webkit-scrollbar { width: 6px; }
  #conversation::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200 px-6 py-4">
  <h1 class="text-xl font-semibold text-slate-900">Aegis Airlines — Refinement Loop Dashboard</h1>
  <p class="text-sm text-slate-500 mt-1">Observation only · No manual intervention possible during a run</p>
</header>

<!-- Controls -->
<div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center gap-3">
  <select id="scenario-select" class="px-3 py-2 border border-slate-300 rounded-md text-sm">
    <option value="book_next_to_destination">book_next_to_destination</option>
    <option value="cheapest_within_week">cheapest_within_week</option>
    <option value="pet_policy_inquiry">pet_policy_inquiry</option>
    <option value="reschedule_booking">reschedule_booking</option>
    <option value="baggage_inquiry" selected>baggage_inquiry</option>
    <option value="cancel_refund">cancel_refund</option>
    <option value="seat_preference">seat_preference</option>
    <option value="add_extra_bag">add_extra_bag</option>
    <option value="checkin_status">checkin_status</option>
    <option value="special_assistance">special_assistance</option>
  </select>
  <button id="run-one-btn" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 disabled:bg-slate-400 disabled:cursor-not-allowed">
    Run This Scenario
  </button>
  <details id="subset-details" class="relative">
    <summary class="px-4 py-2 bg-slate-100 text-slate-700 text-sm rounded-md cursor-pointer hover:bg-slate-200 select-none">
      Run a custom subset
    </summary>
    <div class="absolute left-0 top-full mt-1 z-10 bg-white border border-slate-200 rounded-lg shadow-lg p-4 min-w-[320px]">
      <div class="grid grid-cols-2 gap-x-4 gap-y-1.5 mb-3 text-sm text-slate-700">
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="book_next_to_destination" checked> book_next_to_destination</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="cheapest_within_week" checked> cheapest_within_week</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="pet_policy_inquiry" checked> pet_policy_inquiry</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="reschedule_booking" checked> reschedule_booking</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="baggage_inquiry" checked> baggage_inquiry</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="cancel_refund" checked> cancel_refund</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="seat_preference" checked> seat_preference</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="add_extra_bag" checked> add_extra_bag</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="checkin_status" checked> checkin_status</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="scenario-checkbox" value="special_assistance" checked> special_assistance</label>
      </div>
      <button id="run-subset-btn" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 disabled:bg-slate-400 disabled:cursor-not-allowed">
        Run Selected
      </button>
    </div>
  </details>
  <button id="run-all-btn" class="px-4 py-2 bg-slate-800 text-white text-sm rounded-md hover:bg-slate-900 disabled:bg-slate-400 disabled:cursor-not-allowed">
    Run All 10
  </button>
  <span id="status" class="ml-auto px-3 py-1.5 bg-slate-100 text-slate-600 text-sm rounded-md">idle</span>
</div>

<!-- Main grid -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 p-4">

  <!-- Left: live conversation -->
  <section class="bg-white rounded-lg border border-slate-200 flex flex-col" style="height: 80vh;">
    <header class="px-4 py-3 border-b border-slate-200 flex justify-between items-center">
      <h2 class="font-semibold text-slate-900">Live Conversation</h2>
      <span id="conv-meta" class="text-sm text-slate-500"></span>
    </header>
    <div id="conversation" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm"></div>
  </section>

  <!-- Right column -->
  <div class="flex flex-col gap-4">

    <!-- Iteration history -->
    <section class="bg-white rounded-lg border border-slate-200">
      <header class="px-4 py-3 border-b border-slate-200">
        <h2 class="font-semibold text-slate-900">Iteration History</h2>
      </header>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-600 text-xs uppercase">
            <tr>
              <th class="px-3 py-2 text-left">Iter</th>
              <th class="px-3 py-2 text-left">Version</th>
              <th class="px-3 py-2 text-center">Underst.</th>
              <th class="px-3 py-2 text-center">Tool</th>
              <th class="px-3 py-2 text-center">Outcome</th>
              <th class="px-3 py-2 text-center">Quality</th>
              <th class="px-3 py-2 text-center">Pass</th>
            </tr>
          </thead>
          <tbody id="history-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- Score chart (hidden; re-enable by removing this comment)
    <section class="bg-white rounded-lg border border-slate-200 p-4">
      <h2 class="font-semibold text-slate-900 mb-3">Scores Over Iterations</h2>
      <canvas id="score-chart" height="160"></canvas>
    </section>
    -->
    <div style="display:none"><canvas id="score-chart"></canvas></div>

    <!-- Prompt diff -->
    <section class="bg-white rounded-lg border border-slate-200 flex flex-col" style="max-height: 50vh;">
      <header class="px-4 py-3 border-b border-slate-200 flex justify-between items-center">
        <h2 class="font-semibold text-slate-900">Prompt Diff</h2>
        <select id="diff-select" class="px-2 py-1 border border-slate-300 rounded text-sm"></select>
      </header>
      <div id="diff-summary" class="px-4 py-2 text-sm text-slate-600 italic border-b border-slate-100"></div>
      <pre id="diff-view" class="flex-1 overflow-auto p-3 text-xs whitespace-pre-wrap"></pre>
    </section>
  </div>
</div>

<!-- Event log (collapsible) -->
<details class="mx-4 mb-4 bg-white rounded-lg border border-slate-200">
  <summary class="px-4 py-3 cursor-pointer text-sm font-semibold text-slate-700">Event log (debugging)</summary>
  <pre id="event-log" class="p-3 text-xs text-slate-500 max-h-60 overflow-auto"></pre>
</details>

<script>
const $ = (id) => document.getElementById(id);
const conv = $("conversation");
const historyBody = $("history-body");
const eventLog = $("event-log");
const statusEl = $("status");
const runOneBtn = $("run-one-btn");
const runAllBtn = $("run-all-btn");
const runSubsetBtn = $("run-subset-btn");
const scenarioSelect = $("scenario-select");
const diffSelect = $("diff-select");
const diffView = $("diff-view");
const diffSummary = $("diff-summary");
const convMeta = $("conv-meta");

// Per-scenario state, keyed by scenarioId. Each entry has:
//   { iterations: [{scores, version, ...}], promptFixes: [{old_prompt, new_prompt, summary, iter, version}] }
const scenarioState = {};
let currentScenarioId = null;
let currentIteration = 0;

// Chart
const chart = new Chart($("score-chart").getContext("2d"), {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "understanding", data: [], borderColor: "#3b82f6", backgroundColor: "#3b82f6", tension: 0.3 },
      { label: "tool_use",      data: [], borderColor: "#10b981", backgroundColor: "#10b981", tension: 0.3 },
      { label: "outcome",       data: [], borderColor: "#f59e0b", backgroundColor: "#f59e0b", tension: 0.3 },
      { label: "conv. quality", data: [], borderColor: "#8b5cf6", backgroundColor: "#8b5cf6", tension: 0.3 },
    ],
  },
  options: {
    responsive: true,
    scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } } },
    plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
  },
});

function setStatus(text, kind = "info") {
  statusEl.textContent = text;
  statusEl.className = "ml-auto px-3 py-1.5 text-sm rounded-md " + (
    kind === "running" ? "bg-amber-100 text-amber-800" :
    kind === "success" ? "bg-green-100 text-green-800" :
    kind === "error" ? "bg-red-100 text-red-800" :
    "bg-slate-100 text-slate-600"
  );
}

function setButtonsEnabled(enabled) {
  runOneBtn.disabled = !enabled;
  runAllBtn.disabled = !enabled;
  if (enabled) {
    updateSubsetButtonState();
  } else {
    runSubsetBtn.disabled = true;
  }
}

function updateSubsetButtonState() {
  const anyChecked = [...document.querySelectorAll('.scenario-checkbox')].some(cb => cb.checked);
  runSubsetBtn.disabled = !anyChecked;
}

function logEvent(type, payload) {
  const t = new Date().toLocaleTimeString();
  eventLog.textContent += `[${t}] ${type} ${JSON.stringify(payload).slice(0, 200)}\n`;
  eventLog.scrollTop = eventLog.scrollHeight;
}

function appendTurn(turn) {
  const el = document.createElement("div");
  el.className = "p-2 rounded";
  const role = turn.role;
  if (role === "agent") {
    el.classList.add("turn-agent");
    el.innerHTML = `<div class="text-xs font-semibold text-blue-700 mb-1">AGENT</div><div>${escapeHtml(turn.message || "")}</div>`;
  } else if (role === "user") {
    el.classList.add("turn-user");
    el.innerHTML = `<div class="text-xs font-semibold text-slate-600 mb-1">CUSTOMER</div><div>${escapeHtml(turn.message || "")}</div>`;
  } else if (role === "tool_call") {
    el.classList.add("turn-tool-call");
    el.innerHTML = `<div class="text-xs font-semibold text-yellow-800 mb-1">TOOL CALL</div><div>${escapeHtml(turn.tool_name || "")}(${escapeHtml(turn.params || "")})</div>`;
  } else if (role === "tool_result") {
    const isError = turn.is_error;
    el.classList.add(isError ? "turn-tool-error" : "turn-tool-result");
    const label = isError ? "TOOL RESULT (ERROR)" : "TOOL RESULT";
    const result = (turn.result || "").slice(0, 200);
    el.innerHTML = `<div class="text-xs font-semibold ${isError ? "text-red-800" : "text-green-800"} mb-1">${label}</div><div>${escapeHtml(turn.tool_name || "")} → ${escapeHtml(result)}${turn.result && turn.result.length > 200 ? "…" : ""}</div>`;
  }
  conv.appendChild(el);
  conv.scrollTop = conv.scrollHeight;
}

function escapeHtml(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function appendScenarioDivider(scenarioId, title) {
  const d = document.createElement("div");
  d.className = "scenario-divider";
  d.textContent = `▶ ${scenarioId}${title ? " — " + title : ""}`;
  conv.appendChild(d);
  conv.scrollTop = conv.scrollHeight;
}

function addHistoryRow({ iteration, version, scores, pass: didPass, scenarioId }) {
  // If first row of a new scenario, prepend a header row.
  const lastScenarioRow = historyBody.querySelector("tr:last-child");
  if (lastScenarioRow && lastScenarioRow.dataset.scenarioId !== scenarioId) {
    const sep = document.createElement("tr");
    sep.innerHTML = `<td colspan="7" class="bg-slate-100 text-xs font-semibold text-slate-600 px-3 py-1.5">${escapeHtml(scenarioId)}</td>`;
    historyBody.appendChild(sep);
  } else if (!lastScenarioRow) {
    const sep = document.createElement("tr");
    sep.innerHTML = `<td colspan="7" class="bg-slate-100 text-xs font-semibold text-slate-600 px-3 py-1.5">${escapeHtml(scenarioId)}</td>`;
    historyBody.appendChild(sep);
  }
  const tr = document.createElement("tr");
  tr.dataset.scenarioId = scenarioId;
  const cell = (n) => `<td class="px-3 py-2 text-center ${n >= 8 ? "text-slate-700" : "text-amber-700 font-semibold"}">${n}</td>`;
  tr.innerHTML = `
    <td class="px-3 py-2">${iteration}</td>
    <td class="px-3 py-2 font-mono text-xs">${escapeHtml(version)}</td>
    ${cell(scores.understanding ?? "-")}
    ${cell(scores.tool_use ?? "-")}
    ${cell(scores.outcome ?? "-")}
    ${cell(scores.conversation_quality ?? "-")}
    <td class="px-3 py-2 text-center">${didPass ? "✅" : "❌"}</td>
  `;
  historyBody.appendChild(tr);
}

function pushChartPoint(iteration, scores, scenarioId) {
  // Use a label that distinguishes scenarios in "all" runs.
  const label = `${scenarioId}#${iteration}`;
  chart.data.labels.push(label);
  chart.data.datasets[0].data.push(scores.understanding);
  chart.data.datasets[1].data.push(scores.tool_use);
  chart.data.datasets[2].data.push(scores.outcome);
  chart.data.datasets[3].data.push(scores.conversation_quality);
  chart.update();
}

function addPromptDiffOption(state) {
  const opt = document.createElement("option");
  const label = `${state.scenarioId} · iter ${state.iter} · ${state.old_version} → ${state.new_version}`;
  opt.value = JSON.stringify({ scenarioId: state.scenarioId, iter: state.iter });
  opt.textContent = label;
  diffSelect.appendChild(opt);
  // Auto-select the latest one.
  diffSelect.value = opt.value;
  renderDiff(state);
}

function renderDiff(state) {
  diffSummary.textContent = state.summary || "";
  const diff = Diff.diffLines(state.old_prompt || "", state.new_prompt || "");
  let html = "";
  diff.forEach((part) => {
    const cls = part.added ? "diff-add" : part.removed ? "diff-remove" : "";
    html += `<span class="${cls}">${escapeHtml(part.value)}</span>`;
  });
  diffView.innerHTML = html;
}

diffSelect.addEventListener("change", () => {
  const { scenarioId, iter } = JSON.parse(diffSelect.value);
  const fix = (scenarioState[scenarioId]?.promptFixes || []).find((f) => f.iter === iter);
  if (fix) renderDiff(fix);
});

// --- WebSocket logic --- //

function startRun(action, payload = {}) {
  // Reset UI for a fresh run.
  conv.innerHTML = "";
  historyBody.innerHTML = "";
  diffSelect.innerHTML = "";
  diffView.textContent = "";
  diffSummary.textContent = "";
  chart.data.labels = [];
  chart.data.datasets.forEach((d) => (d.data = []));
  chart.update();
  eventLog.textContent = "";
  Object.keys(scenarioState).forEach((k) => delete scenarioState[k]);
  currentScenarioId = null;
  currentIteration = 0;
  convMeta.textContent = "";

  setButtonsEnabled(false);
  setStatus("connecting…", "running");

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws/run`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ action, ...payload }));
    setStatus("running…", "running");
  };

  ws.onmessage = (ev) => {
    const { type, payload } = JSON.parse(ev.data);
    logEvent(type, payload);
    handleEvent(type, payload);
  };

  ws.onerror = () => setStatus("WebSocket error", "error");
  ws.onclose = () => {
    setButtonsEnabled(true);
    if (statusEl.textContent === "running…") setStatus("disconnected", "error");
  };
}

function handleEvent(type, payload) {
  switch (type) {
    case "run_started": {
      currentScenarioId = payload.scenario_id;
      currentIteration = 0;
      scenarioState[currentScenarioId] = scenarioState[currentScenarioId] || { iterations: [], promptFixes: [] };
      appendScenarioDivider(payload.scenario_id, payload.scenario_title);
      convMeta.textContent = `${payload.scenario_id}`;
      setStatus(`running: ${payload.scenario_id}`, "running");
      break;
    }
    case "iteration_started": {
      currentIteration = payload.iteration;
      convMeta.textContent = `${currentScenarioId} · iteration ${payload.iteration}`;
      // Visually mark a new iteration with a faint divider.
      const sep = document.createElement("div");
      sep.className = "text-xs uppercase tracking-wide text-slate-400 border-t border-slate-200 pt-2 mt-2";
      sep.textContent = `Iteration ${payload.iteration} · ${payload.prompt_version}`;
      conv.appendChild(sep);
      break;
    }
    case "transcript_turn": {
      appendTurn(payload);
      break;
    }
    case "evaluation_complete": {
      addHistoryRow({
        iteration: payload.iteration,
        version: scenarioState[currentScenarioId]?.lastVersion || `iter${payload.iteration}`,
        scores: payload.scores,
        pass: payload.overall_pass,
        scenarioId: currentScenarioId,
      });
      pushChartPoint(payload.iteration, payload.scores, currentScenarioId);
      break;
    }
    case "prompt_fixed": {
      const state = {
        scenarioId: currentScenarioId,
        iter: payload.iteration,
        old_version: payload.old_version,
        new_version: payload.new_version,
        old_prompt: payload.old_prompt,
        new_prompt: payload.new_prompt,
        summary: payload.summary,
      };
      scenarioState[currentScenarioId].promptFixes.push(state);
      scenarioState[currentScenarioId].lastVersion = payload.new_version;
      addPromptDiffOption(state);
      break;
    }
    case "code_fixed": {
      // Show a small toast in the conversation panel.
      const el = document.createElement("div");
      el.className = "p-2 rounded bg-purple-50 border-l-3 border-purple-500 text-sm text-purple-800";
      el.innerHTML = `<div class="text-xs font-semibold mb-1">CODE PATCH APPLIED</div><div>${payload.patches_applied} patch(es) — ${escapeHtml(payload.summary || "")}</div>`;
      conv.appendChild(el);
      conv.scrollTop = conv.scrollHeight;
      break;
    }
    case "run_complete": {
      const msg = payload.converged
        ? `✅ converged on iteration ${payload.iterations}`
        : `⚠ did not converge in ${payload.iterations} iterations`;
      const el = document.createElement("div");
      el.className = "p-2 rounded bg-slate-900 text-white text-sm font-semibold mt-2";
      el.textContent = msg;
      conv.appendChild(el);
      conv.scrollTop = conv.scrollHeight;
      setStatus(msg, payload.converged ? "success" : "error");
      break;
    }
    case "all_complete": {
      setStatus(`done — ${payload.converged_count}/${payload.total_runs} converged`, "success");
      break;
    }
    case "backend_log": {
      const msg = payload.message || "";
      if (!msg.includes("HTTP/1.1") && !msg.includes("HTTP/1.0")) break;
      const el = document.createElement("div");
      el.className = "bg-slate-100 text-slate-600 text-xs font-mono px-2 py-1 border-l-2 border-slate-400";
      el.textContent = `[backend] ${msg}`;
      conv.appendChild(el);
      conv.scrollTop = conv.scrollHeight;
      break;
    }
    case "error": {
      setStatus("error: " + payload.message, "error");
      const el = document.createElement("div");
      el.className = "p-2 rounded bg-red-100 text-red-800 text-sm";
      el.textContent = "ERROR: " + payload.message;
      conv.appendChild(el);
      break;
    }
  }
}

document.querySelectorAll('.scenario-checkbox').forEach(cb => {
  cb.addEventListener('change', updateSubsetButtonState);
});
updateSubsetButtonState();

runOneBtn.addEventListener("click", () => {
  startRun("start_one", { scenario_id: scenarioSelect.value });
});

runAllBtn.addEventListener("click", () => {
  startRun("start_all");
});

runSubsetBtn.addEventListener("click", () => {
  const ids = [...document.querySelectorAll('.scenario-checkbox:checked')].map(cb => cb.value);
  $("subset-details").open = false;
  startRun("start_subset", { scenario_ids: ids });
});
</script>

</body>
</html>
